<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيق نما</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF7F1;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#30406A;text-align:center}
  .box{padding:32px 24px;max-width:360px}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:15px;color:#5a6788;margin:0 0 24px}
  a.btn{display:block;margin:12px 0;padding:14px;border-radius:14px;background:#30406A;color:#fff;text-decoration:none;font-size:17px}
  a.btn.alt{background:#F8B838;color:#30406A}
</style>
</head>
<body>
<div class="box">
  <h1>جارٍ فتح تطبيق نما…</h1>
  <p>إن لم يُفتح المتجر تلقائيًا، اختر متجر جهازك:</p>
  <a class="btn" id="ios" href="https://apps.apple.com/us/app/%D8%AA%D8%B7%D8%A8%D9%8A%D9%82-%D9%86%D9%85%D8%A7/id6791993923">App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.namaapp.nama">Google Play</a>
</div>
<script>
  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (ua.indexOf("Macintosh") > -1 && "ontouchend" in document);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) location.replace(document.getElementById("ios").href);
    else if (isAndroid) location.replace(document.getElementById("android").href);
  })();
</script>
</body>
</html>
